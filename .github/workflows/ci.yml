name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a PR cancels the run still in flight for it. Runs on main are
# never cancelled, so the cache always gets seeded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26.04 during
    # late 2026, where the default JDK becomes 25 and JDK 8 is removed. Pinning
    # means the flip happens when someone chooses it, not on a random Tuesday.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # No `cache: gradle` here on purpose — setup-gradle below owns the
          # Gradle cache, and the Gradle docs warn against configuring both.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes to the cache; PR runs read it. This is the action's
          # default, stated explicitly so the behaviour is not a surprise when a
          # PR run reports a cache miss.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The runner image ships the Android SDK, but its exact platform revisions
      # drift between weekly image builds. When a revision the build wants is
      # missing, Gradle tries to download it and fails on unaccepted licences.
      # This step makes the SDK state explicit instead of inherited.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # `build` already runs lint, but as a separate step so a lint failure is
      # legible in the job summary rather than buried in the build log.
      - name: Lint
        run: ./gradlew lint --no-daemon

      # Static analysis. Kept separate from lint for the same reason: a detekt
      # failure should name itself in the job summary.
      #
      # No --auto-correct here on purpose. The formatting rules can rewrite
      # sources, and a CI run that edits its own checkout to go green hides the
      # very diff a reviewer needs to see. Developers run
      # `./gradlew detektAll -PdetektAutoCorrect=true` locally instead.
      - name: Detekt
        run: ./gradlew detektAll --no-daemon

      # The 90% coverage gate on business logic (use cases, repositories,
      # ViewModels, the sync engine and the mappers). Runs after the unit tests
      # above so it reuses their execution data.
      - name: Coverage gate
        run: ./gradlew jacocoCoverageVerificationAll --no-daemon

      - name: Upload test reports
        # Runs even when a previous step failed — the reports are most useful
        # exactly when something went wrong.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/
            **/build/reports/jacoco/
          retention-days: 7
          if-no-files-found: ignore
