# Robolectric emulates SDK 34, not the project's compileSdk of 37.
#
# Compose UI tests go through Espresso's input injection, which calls
# InputManager.getInstance(). That method was removed in later platform
# versions, so on SDK 37 every Compose test fails with:
#   NoSuchMethodException: android.hardware.input.InputManager.getInstance()
#
# This only affects the emulated runtime for these JVM tests. The app itself
# still compiles against 37 and targets 36.
sdk=34
